# Database migrations. The connection URL comes from app settings (.env), never from this file.
#   alembic upgrade head        apply all migrations
#   alembic current             show the applied revision
#   alembic downgrade -1        roll back one migration

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
