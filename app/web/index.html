<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrishiMitra Test Console</title>
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --ink: #1d2a1f; --muted: #66736a; --line: #dfe4dc;
    --accent: #2f7d32; --accent-ink: #ffffff; --warn-bg: #fff4e5; --warn-ink: #8a4b00;
    --err-bg: #fdecea; --err-ink: #a12622; --user-bg: #e8f3e8; --code-bg: #f0f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141814; --panel: #1c211c; --ink: #e4ebe4; --muted: #95a196; --line: #2f372f;
      --accent: #5fae63; --accent-ink: #0f140f; --warn-bg: #3a2c12; --warn-ink: #ffcf8a;
      --err-bg: #3d1b19; --err-ink: #ffb4ad; --user-bg: #223022; --code-bg: #232923;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 "Noto Sans", "Nirmala UI", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .tag { font-size: 12px; color: var(--muted); }
  .status { margin-left: auto; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #999; margin-right: 4px; }
  .dot.ok { background: #2e9d3a; } .dot.bad { background: #d23b2f; } .dot.warn { background: #e0a100; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  #log { display: flex; flex-direction: column; gap: 14px; padding-bottom: 210px; }
  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .q { background: var(--user-bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; white-space: pre-wrap; }
  .answer { overflow-wrap: anywhere; }
  .answer ul { margin: 4px 0 4px 20px; padding: 0; }
  .answer p { margin: 6px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12px; }
  .new-conv, .rate { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .api-key { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 6px; padding: 2px 8px; width: 170px; }
  .rate.chosen { border-color: var(--accent); background: var(--user-bg); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .chip.good { color: var(--accent); border-color: var(--accent); }
  .chip.bad { color: var(--err-ink); border-color: var(--err-ink); }
  .sources { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .sources ol { margin: 4px 0 0 20px; padding: 0; }
  .warning { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 14px; }
  .error { background: var(--err-bg); color: var(--err-ink); border-radius: 8px; padding: 8px 10px; }
  details { margin-top: 10px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); }
  .photo-btn { height: 40px; width: 44px; display: grid; place-items: center; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 20px; }
  .photo-btn.active { border-color: var(--accent); background: var(--user-bg); }
  #photo-info { display: inline-flex; gap: 6px; align-items: center; }
  #photo-info[hidden] { display: none; }
  #photo-info select, #photo-info button { height: 26px; font: inherit; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .q img, .q video { display: block; max-width: 220px; max-height: 160px; border-radius: 6px; margin-top: 6px; }
  .diagnosis { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
  .diagnosis strong { font-size: 14px; }
  .chunk { background: var(--code-bg); border-radius: 6px; padding: 6px 8px; margin-top: 6px; white-space: pre-wrap; font-size: 12px; max-height: 160px; overflow: auto; }
  .timings { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); }
  .composer-inner { max-width: 980px; margin: 0 auto; padding: 10px 16px 14px; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .samples button { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-height: 52px; max-height: 160px; resize: vertical; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  select, .send { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 0 8px; }
  .send { background: var(--accent); color: var(--accent-ink); border: none; padding: 0 18px; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .55; cursor: wait; }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  @media (max-width: 600px) { .row { flex-wrap: wrap; } select { flex: 1; } .status { display: none; } }
</style>
</head>
<body>
<header>
  <h1>🌾 KrishiMitra</h1>
  <span class="tag">developer test console — not the farmer app</span>
  <input id="api-key" class="api-key" type="password" autocomplete="off" placeholder="API key (if required)" title="X-API-Key, kept for this tab only">
  <button type="button" id="new-conv" class="new-conv" title="Forget the conversation history">New conversation</button>
  <div class="status" id="status"><span><span class="dot"></span>checking…</span></div>
</header>

<main>
  <div id="log"><p class="empty" id="empty">Ask a question in English, తెలుగు, ಕನ್ನಡ or हिन्दी — or romanized (e.g. “tamatar mein jhulsa ka ilaj”).</p></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <div class="samples" id="samples"></div>
    <div class="row">
      <textarea id="msg" placeholder="Type a farming question…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <select id="lang" title="Answer language">
        <option value="">Auto-detect</option>
        <option value="en">English</option>
        <option value="te">తెలుగు</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="hi">हिन्दी</option>
      </select>
      <label class="photo-btn" title="Attach a plant photo or short video">📷<input type="file" id="photo" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/3gpp,video/webm,.mp4,.mov,.3gp,.webm,.mkv" hidden></label>
      <button class="send" id="send">Send</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="stream" checked> Stream answer</label>
      <label><input type="checkbox" id="debug" checked> Show retrieval details</label>
      <span id="photo-info" hidden>
        <span id="photo-name"></span>
        <select id="crop" title="Crop in the photo (recommended)">
          <option value="">Crop: not specified</option>
          <option value="tomato">Tomato</option><option value="potato">Potato</option>
          <option value="chilli">Chilli / Capsicum</option><option value="brinjal">Brinjal</option>
          <option value="okra">Okra</option><option value="rice">Rice</option>
          <option value="wheat">Wheat</option><option value="maize">Maize</option>
          <option value="cotton">Cotton</option><option value="groundnut">Groundnut</option>
          <option value="redgram">Redgram</option><option value="cowpea">Cowpea</option>
          <option value="bean">Bean</option><option value="soybean">Soybean</option>
          <option value="cucumber">Cucumber</option><option value="pumpkin">Pumpkin</option>
          <option value="gourds">Gourds</option><option value="ginger">Ginger</option>
          <option value="grape">Grape</option><option value="apple">Apple</option>
          <option value="citrus">Citrus</option><option value="mango">Mango</option>
          <option value="banana">Banana</option>
        </select>
        <button type="button" id="photo-clear" title="Remove photo">✕</button>
      </span>
    </div>
  </div>
</div>

<script>
"use strict";
const API = "/api/v1/chat";
const SAMPLES = [
  "What is the waiting period for acetamiprid on cotton?",
  "టమాటాలో ఎర్లీ బ్లైట్ నివారణ ఎలా?",
  "pattilo tella doma nivaranaku e mandu vadali",
  "ತೊಗರಿಯಲ್ಲಿ ಕಾಯಿ ಕೊರಕ ಹುಳುವಿನ ನಿಯಂತ್ರಣ ಹೇಗೆ?",
  "गेहूं में पीला रतुआ का इलाज",
  "Can I use phorate for stem borer in paddy?",
];
const $ = (id) => document.getElementById(id);
const log = $("log"), msg = $("msg"), send = $("send");

// ---------------------------------------------------------------- helpers
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Minimal, safe markdown: text is escaped first (no HTML from the model is ever executed).
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderMarkdown(text) {
  const lines = escapeHtml(text).split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\s)\*(\S.*?)\*(?=\s|$)/g, "$1<em>$2</em>");
    const bullet = line.match(/^\s*(?:[*\-•]|\d+[.)])\s+(.*)$/);
    if (bullet) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${bullet[1]}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (line.trim()) html += `<p>${line}</p>`;
    }
  }
  return html + (inList ? "</ul>" : "");
}

function chip(text, cls) { return el("span", "chip" + (cls ? " " + cls : ""), text); }

// ---------------------------------------------------------------- health
async function checkHealth() {
  const box = $("status");
  try {
    const r = await fetch("/health/ready");
    const body = await r.json();
    box.replaceChildren(...body.checks.map((c) => {
      const s = el("span");
      s.append(el("span", "dot " + (c.status === "ok" ? "ok" : c.critical ? "bad" : "warn")), `${c.name} ${c.status}`);
      return s;
    }));
  } catch {
    box.replaceChildren(Object.assign(el("span"), { innerHTML: '<span class="dot bad"></span>server unreachable' }));
  }
}

// ---------------------------------------------------------------- rendering
function renderResult(turn, data, wallMs, firstTokenMs) {
  const answer = turn.querySelector(".answer");
  // The safety warning is appended to the answer text; show it separately, highlighted.
  let text = data.response;
  for (const w of data.safety_warnings || []) text = text.replace(w, "").trimEnd();
  answer.innerHTML = renderMarkdown(text);

  if (data.diagnosis) renderDiagnosis(turn, data.diagnosis);
  for (const w of data.safety_warnings || []) turn.append(el("div", "warning", w));

  const meta = el("div", "meta");
  meta.append(
    chip(data.grounded ? "grounded in documents" : "NOT grounded", data.grounded ? "good" : "bad"),
    chip(`language: ${data.language}${data.language_detected ? " (auto)" : ""}`),
    chip(`model: ${data.model}`),
    chip(`server ${data.processing_time.toFixed(2)} s`),
    chip(`wall ${(wallMs / 1000).toFixed(2)} s`),
  );
  if (firstTokenMs != null) meta.append(chip(`first text ${(firstTokenMs / 1000).toFixed(2)} s`));
  if (data.truncated) meta.append(chip("truncated", "bad"));
  meta.append(chip(`tokens in ${data.usage.input_tokens} / out ${data.usage.output_tokens}`));
  if (data.conversation_id) conversationId = data.conversation_id;  // next questions continue it
  if (data.message_id) {
    for (const [rating, label] of [["up", "👍"], ["down", "👎"]]) {
      const button = el("button", "rate", label);
      button.type = "button";
      button.title = `Rate this answer ${rating}`;
      button.addEventListener("click", () => rate(data.message_id, rating, button));
      meta.append(button);
    }
  }
  turn.append(meta);

  if (data.sources && data.sources.length) {
    const box = el("div", "sources");
    box.append(el("strong", null, "Sources"));
    const ol = el("ol");
    for (const s of data.sources) {
      const pages = s.page_start ? `, p. ${s.page_start}${s.page_end && s.page_end !== s.page_start ? "–" + s.page_end : ""}` : "";
      ol.append(el("li", null, `${s.title}${pages}${s.as_of ? " (as of " + s.as_of + ")" : ""}`));
    }
    box.append(ol);
    turn.append(box);
  }

  const d = data.debug;
  if (d) {
    const det = el("details");
    det.append(el("summary", null, `Retrieval details — crops: ${d.crops_detected.join(", ") || "none"}; ` +
      `keywords: ${d.keyword_query || "none"}${d.retrieval_error ? "; ERROR: " + d.retrieval_error : ""}`));
    const lc = d.language_check;
    if (lc) det.append(el("div", "timings",
      `language: detected by ${lc.detection_method}, answer ${(lc.answer_script_share * 100).toFixed(0)}% in target script, ` +
      `foreign-script chars ${lc.foreign_script_chars}${lc.retried ? ", RETRIED" : ""}`));
    det.append(el("div", "timings", Object.entries(d.timings_ms).map(([k, v]) => `${k} ${Math.round(v)} ms`).join(" · ")));
    for (const c of d.chunks) {
      const sim = c.vector_similarity != null ? `sim ${c.vector_similarity.toFixed(3)}` : "keyword only";
      det.append(el("div", "chunk", `[${c.index}] score ${c.score.toFixed(4)} · ${sim} · vector rank ${c.vector_rank ?? "-"} · ` +
        `keyword rank ${c.keyword_rank ?? "-"} · crops ${c.crops.join(", ") || "-"}\n${c.text}`));
    }
    turn.append(det);
  }
}

function showError(turn, status, body) {
  const e = body && body.error ? body.error : { code: "error", message: String(body) };
  let hint = "";
  if (e.code === "llm_rate_limited") hint = " — free-tier limit: wait a minute and try again.";
  if (e.code === "llm_quota_exhausted") hint = " — daily free quota used up.";
  turn.querySelector(".answer").replaceChildren(el("div", "error",
    `Error ${status || ""} ${e.code}: ${e.message}${hint}${e.request_id ? " (request " + e.request_id + ")" : ""}`));
}

// ---------------------------------------------------------------- sending
async function ask(text) {
  const message = text.trim();
  const photo = $("photo").files[0];
  if (!message && !photo) return;
  $("empty")?.remove();
  const turn = el("div", "turn");
  const video = photo && isVideo(photo);
  const question = el("div", "q", message || (photo ? (video ? "(video only)" : "(photo only)") : ""));
  if (photo) {
    const preview = document.createElement(video ? "video" : "img");
    preview.src = URL.createObjectURL(photo);
    if (video) { preview.controls = true; preview.muted = true; preview.preload = "metadata"; }
    else preview.alt = "uploaded photo";
    question.append(preview);
  }
  turn.append(question, el("div", "answer", "…"));
  log.append(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "end" });

  const payload = { message, debug: $("debug").checked };
  if ($("lang").value) payload.language = $("lang").value;
  if (conversationId) payload.conversation_id = conversationId;
  send.disabled = true;
  const start = performance.now();
  try {
    if (photo) await askPhoto(turn, photo, message, start);
    else if ($("stream").checked) await askStream(turn, payload, start);
    else {
      const r = await fetch(API, { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(payload) });
      const body = await r.json().catch(() => null);
      if (!r.ok) showError(turn, r.status, body);
      else renderResult(turn, body, performance.now() - start, null);
    }
  } catch (err) {
    showError(turn, "", { error: { code: "network_error", message: String(err) } });
  } finally {
    send.disabled = false;
    turn.scrollIntoView({ behavior: "smooth", block: "end" });
    msg.focus();
  }
}

async function askPhoto(turn, photo, message, start) {
  const form = new FormData();
  form.append("file", photo);
  if (message) form.append("message", message);
  if ($("lang").value) form.append("language", $("lang").value);
  if ($("crop").value) form.append("crop", $("crop").value);
  form.append("debug", $("debug").checked ? "true" : "false");
  if (conversationId) form.append("conversation_id", conversationId);
  const endpoint = isVideo(photo) ? "/video" : "/image";
  clearPhoto();
  const r = await fetch(API + endpoint, { method: "POST", headers: authHeaders(), body: form });
  const body = await r.json().catch(() => null);
  if (!r.ok) { showError(turn, r.status, body); return; }
  renderResult(turn, body, performance.now() - start, null);
}

function renderDiagnosis(turn, d) {
  const box = el("div", "diagnosis");
  const statusClass = d.status === "confident" ? "good" : (d.status === "uncertain" ? "" : "bad");
  const head = el("div");
  head.append(chip(`${d.video ? "video" : "photo"}: ${d.status}`, statusClass), " ",
    el("strong", null, `${d.crop_name} — ${d.condition.name}`),
    ` (confidence ${d.confidence.toFixed(2)}, model said ${d.model_confidence.toFixed(2)})`);
  box.append(head);
  if (d.alternatives.length) box.append(el("div", null, "Other possibilities: " +
    d.alternatives.map((a) => `${a.condition.name} (${a.confidence.toFixed(2)})`).join(", ")));
  if (d.visible_symptoms.length) box.append(el("div", null, "Symptoms seen: " + d.visible_symptoms.join("; ")));
  if (d.severity && d.severity !== "unknown") box.append(el("div", null, "Severity: " + d.severity));
  const q = d.quality;
  const v = d.video;
  if (v) box.append(el("div", "timings", `video ${v.width}×${v.height} ${v.container}/${v.codec}, ` +
    `${v.duration_seconds} s, frames used at ${v.frames_used.map((t) => t + " s").join(", ") || "none"} ` +
    `(${v.frames_examined} checked)${v.has_audio ? ", sound track ignored" : ""}`));
  box.append(el("div", "timings", `${v ? "best frame" : "photo"} ${q.width}×${q.height}, brightness ${q.brightness}, sharpness ${q.sharpness}` +
    (q.issues.length ? ` — issues: ${q.issues.join(", ")}` : "")));
  if (d.reasons.length) box.append(el("div", "timings", "confidence lowered: " + d.reasons.join("; ")));
  turn.querySelector(".answer").before(box);
}

let conversationId = null;

// Optional API key (needed only where AUTH_REQUIRED is on). Kept for this browser tab only.
const keyInput = $("api-key");
try { keyInput.value = sessionStorage.getItem("km-api-key") || ""; } catch {}
keyInput.addEventListener("change", () => {
  try { sessionStorage.setItem("km-api-key", keyInput.value.trim()); } catch {}
});
function authHeaders(extra = {}) {
  const key = keyInput.value.trim();
  return key ? { ...extra, "X-API-Key": key } : extra;
}

async function rate(messageId, rating, button) {
  const r = await fetch("/api/v1/feedback", { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ message_id: messageId, rating }) });
  if (r.ok) {
    button.parentElement.querySelectorAll(".rate").forEach((b) => b.classList.remove("chosen"));
    button.classList.add("chosen");
  } else {
    const body = await r.json().catch(() => null);
    button.title = `feedback failed: ${body?.error?.message || r.status}`;
  }
}

function isVideo(file) {
  return file.type.startsWith("video/") || /\.(mp4|mov|3gp|webm|mkv)$/i.test(file.name);
}

function clearPhoto() {
  $("photo").value = "";
  $("photo-info").hidden = true;
  document.querySelector(".photo-btn").classList.remove("active");
}

async function askStream(turn, payload, start) {
  const r = await fetch(API + "/stream", { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(payload) });
  if (!r.ok) { showError(turn, r.status, await r.json().catch(() => null)); return; }
  const answer = turn.querySelector(".answer");
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", text = "", firstToken = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, sep); buffer = buffer.slice(sep + 2);
      const event = (block.match(/^event: (.*)$/m) || [])[1];
      const dataLine = (block.match(/^data: (.*)$/m) || [])[1];
      if (!event || !dataLine) continue;
      const data = JSON.parse(dataLine);
      if (event === "delta") {
        if (firstToken === null) firstToken = performance.now() - start;
        text += data.text;
        answer.innerHTML = renderMarkdown(text);
      } else if (event === "done") {
        renderResult(turn, data, performance.now() - start, firstToken);
      } else if (event === "error") {
        showError(turn, "", data);
      }
    }
  }
}

send.addEventListener("click", () => { const t = msg.value; msg.value = ""; ask(t); });
msg.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); }
});
for (const s of SAMPLES) {
  const b = el("button", null, s.length > 42 ? s.slice(0, 40) + "…" : s);
  b.title = s;
  b.addEventListener("click", () => ask(s));
  $("samples").append(b);
}
$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  $("photo-info").hidden = !file;
  $("photo-name").textContent = file ? `📎 ${file.name} (${Math.round(file.size / 1024)} KB)` : "";
  document.querySelector(".photo-btn").classList.toggle("active", Boolean(file));
});
$("photo-clear").addEventListener("click", clearPhoto);
$("new-conv").addEventListener("click", () => {
  conversationId = null;
  log.replaceChildren(Object.assign(el("div", "empty", "New conversation started."), { id: "empty" }));
});
checkHealth();
setInterval(checkHealth, 30000);
msg.focus();
</script>
</body>
</html>
